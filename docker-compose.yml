# ==============================================================================
# Unified AI Inference & RAG Stack: Ollama (GPU + CPU Embed), Open-WebUI & Reranker
# Hardware Target: AMD Ryzen 7 5800H (16GB RAM) + NVIDIA GTX 1650 (4GB VRAM)
# Architecture: Parallel GPU Inference (Port 11434) + Parallel CPU Embeddings (Port 11435)
#               + Open-WebUI (Port 3000) + CPU Cross-Encoder Reranker (Port 8080)
# Compatible with Docker Compose & Podman Compose (CDI / NVIDIA Container Toolkit)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Ollama Inference Engine (GPU-Accelerated - 4GB VRAM Tuned for Coding)
  # ----------------------------------------------------------------------------
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1          # Limits KV-cache allocation to save ~2.5GB VRAM
      - OLLAMA_MAX_LOADED_MODELS=1     # Keeps the coder model permanently pinned in VRAM
      - OLLAMA_KEEP_ALIVE=24h
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_FLASH_ATTENTION=1       # Halves KV-cache memory allocation
      - OLLAMA_KV_CACHE_TYPE=q8_0      # 8-bit quantization prevents CUDA OOM
    volumes:
      - /var/lib/ollama/data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    devices:
      - "nvidia.com/gpu=all"
    security_opt:
      - label=disable

  # ----------------------------------------------------------------------------
  # 2. CPU Embedding Engine (16-Thread Ryzen 7 5800H - Zero GPU Usage)
  # ----------------------------------------------------------------------------
  ollama-embed-cpu:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-embed-cpu
    hostname: ollama-embed-cpu
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=2          # Allows concurrent embedding worker requests
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_THREAD=12           # High thread allocation on Zen 3 cores
      - NVIDIA_VISIBLE_DEVICES=none    # Enforces 100% CPU execution; 0 MB VRAM used
    volumes:
      - /var/lib/ollama/data:/root/.ollama  # Shared volume avoids duplicate model downloads
    ports:
      - "127.0.0.1:11435:11434"       # Host port 11435 -> container port 11434
    security_opt:
      - label=disable

  # ----------------------------------------------------------------------------
  # 3. Open-WebUI (Web Management Interface)
  # ----------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    hostname: open-webui
    restart: unless-stopped
    ports:
      # Host port 3000 mapped to container's internal port 8080 (No collision with reranker)
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
      - ENABLE_OPENAI_API=false
    volumes:
      - /var/lib/ollama/ui:/app/backend/data
    depends_on:
      - ollama
    security_opt:
      - label=disable

  # ----------------------------------------------------------------------------
  # 4. Continue CPU Cross-Encoder Reranker (100% CPU, 0 MB VRAM)
  # ----------------------------------------------------------------------------
  rerank-server:
    build:
      context: .
      dockerfile: Dockerfile.reranker
    image: localhost/continue-reranker:latest
    container_name: rerank-server
    hostname: rerank-server
    restart: unless-stopped
    environment:
      - MODEL_NAME=BAAI/bge-reranker-base
      - DEVICE=cpu
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      # Persist Hugging Face weights on host so models are not re-downloaded
      - /var/lib/ollama/rerank-cache:/root/.cache/huggingface
    ports:
      # Host port 8080 mapped to container port 8080 for Continue huggingface-tei provider
      - "127.0.0.1:8080:8080"
    security_opt:
      - label=disable
