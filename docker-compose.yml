# ==============================================================================
# Unified AI Inference, Embeddings & RAG Stack: Ollama, CPU-Embed, Open-WebUI & Reranker
# Hardware Target: AMD Ryzen 7 5800H (16GB RAM) + NVIDIA GTX 1650 Mobile (4GB VRAM)
# Architecture: Parallel GPU Inference (Port 11434) + Parallel CPU Embeddings (Port 11435)
#               + Open-WebUI (Port 3000) + CPU Cross-Encoder Reranker (Port 8080)
# Compatible with Docker Compose & Podman Compose (CDI / NVIDIA Container Toolkit)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Ollama Inference Engine (GPU-Accelerated - Coding, Reasoning & Chat)
  # ----------------------------------------------------------------------------
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1          # Single worker to conserve ~2.5GB KV-cache on 4GB VRAM
      - OLLAMA_MAX_LOADED_MODELS=1     # Dedicated GPU execution; prevents embedder swapping
      - OLLAMA_KEEP_ALIVE=24h          # Keeps main coder model hot in VRAM
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_FLASH_ATTENTION=1       # Flash attention cuts VRAM allocation in half
      - OLLAMA_KV_CACHE_TYPE=q8_0      # Quantized 8-bit KV cache prevents CUDA OOM at 8k-16k
    volumes:
      - /var/lib/ollama/data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    devices:
      - "nvidia.com/gpu=all"
    security_opt:
      - label=disable

  # ----------------------------------------------------------------------------
  # 2. Ollama CPU Embedding Engine (16-Thread Ryzen 7 5800H - Zero VRAM Usage)
  # ----------------------------------------------------------------------------
  # Runs concurrently on system RAM, allowing background Continue codebase indexing
  # while the GPU runs chat, diff edits, and summarization in parallel on port 11434.
  ollama-embed-cpu:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-embed-cpu
    hostname: ollama-embed-cpu
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=2          # Parallel embedding worker threads
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_THREAD=8            # Saturates physical Zen 3 cores without hyperthread thrashing
      - NVIDIA_VISIBLE_DEVICES=none    # Forces 100% CPU execution; zero GPU memory allocation
    volumes:
      - /var/lib/ollama/data:/root/.ollama  # Shares model store with ollama GPU container
    ports:
      - "127.0.0.1:11435:11434"       # Host port 11435 -> container internal port 11434
    security_opt:
      - label=disable

  # ----------------------------------------------------------------------------
  # 3. Open-WebUI (Web Management Interface)
  # ----------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    hostname: open-webui
    restart: unless-stopped
    ports:
      # Host port 3000 mapped to container's internal port 8080 (No collision with reranker)
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
      - ENABLE_OPENAI_API=false
    volumes:
      - /var/lib/ollama/ui:/app/backend/data
    depends_on:
      - ollama
    security_opt:
      - label=disable

  # ----------------------------------------------------------------------------
  # 4. Continue CPU Cross-Encoder Reranker (100% CPU, 0 MB VRAM)
  # ----------------------------------------------------------------------------
  rerank-server:
    build:
      context: .
      dockerfile: Dockerfile.reranker
    image: localhost/continue-reranker:latest
    container_name: rerank-server
    hostname: rerank-server
    restart: unless-stopped
    environment:
      - MODEL_NAME=BAAI/bge-reranker-base
      - DEVICE=cpu
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      # Persist Hugging Face weights on host so models are not re-downloaded
      - /var/lib/ollama/rerank-cache:/root/.cache/huggingface
    ports:
      # Host port 8080 mapped to container port 8080 for Continue huggingface-tei provider
      - "127.0.0.1:8080:8080"
    security_opt:
      - label=disable
