name: VSCode-Continue-Ollama-ArchLinux-MCP
version: 1.0.0
schema: v1

# ==============================================================================
# 1. CORE ROLES & SHORTCUT ASSIGNMENTS
# ==============================================================================
# Hardware Profile:
#   GPU: NVIDIA GeForce GTX 1650 Mobile (4096 MiB VRAM / 4GB)
#   CPU: AMD Ryzen 7 5800H (8 physical Zen 3 cores, 16 threads)
#   RAM: 16 GiB System DDR4 (2x 8GB SODIMM @ 3200 MT/s)
#   Ollama: Podman/Docker compose on 127.0.0.1:11434 with Flash Attention & Q8_0 KV Cache
# ==============================================================================

# 🛠️ Inline code adjustments (Ctrl+I)
editModel:
  name: Qwen2.5-Coder 7B (GPU)
  provider: openai
  model: qwen2.5-coder:7b-instruct-q4_K_M
  apiBase: http://localhost:11434/v1

# ⚡ Codeblock refactoring applications
applyModel:
  name: Qwen2.5-Coder 7B (GPU)
  provider: openai
  model: qwen2.5-coder:7b-instruct-q4_K_M
  apiBase: http://localhost:11434/v1

# ⌨️ Ghost-text tab completions (Forced 100% to CPU & 16GB RAM to prevent VRAM eviction)
tabAutocompleteModel:
  name: Qwen 1.5B Base (CPU Autocomplete)
  provider: ollama
  model: qwen2.5-coder:1.5b-base-q8_0
  apiBase: http://localhost:11434

# 📂 Codebase semantic search context (@codebase)
embeddingsProvider:
  provider: ollama
  model: nomic-embed-text
  apiBase: http://localhost:11434

# 🎯 Search result ranking optimization (Runs on CPU via TEI or FastAPI on port 8080)
rerankerProvider:
  provider: huggingface-tei
  model: BAAI/bge-reranker-base
  apiBase: http://localhost:8080

# ==============================================================================
# 2. LOCAL MODEL POOL & HARDWARE ALLOCATION
# ==============================================================================
models:
  # 👑 PRIMARY AGENT, CHAT & EDIT MODEL (GPU Accelerated on GTX 1650)
  # Qwen 2.5 Coder 7B Q4 offloads ~24-28 layers to 4GB VRAM, remaining to 16GB RAM.
  - name: Qwen2.5-Coder 7B (GPU)
    provider: openai
    model: qwen2.5-coder:7b-instruct-q4_K_M
    apiBase: http://localhost:11434/v1
    roles:
      - chat
      - edit
      - apply
      - summarize
    contextLength: 4096
    requestOptions:
      numCtx: 4096
      numPredict: 1024
      temperature: 0.1
    chatOptions:
      baseSystemMessage: "You are a senior software engineer. When asked to write programming code, provide clean, modular, and performance-optimized code blocks immediately without pleasantries. When asked to write prose, documentation, or git logs, output direct clean markdown text."
      baseAgentSystemMessage: "You are an advanced coding agent execution engine. You have explicit permission to request file reads, file writes, git actions, and terminal command execution using your system tools. Do not complain about environment restrictions. Execute the tool payload or request directly."

  # ⚡ 100% VRAM CHAT & INLINE EDITS (Zero CPU Offloading / Ultra Fast)
  - name: Qwen2.5-Coder 3B (100% VRAM)
    provider: openai
    model: qwen2.5-coder:3b-instruct-q8_0
    apiBase: http://localhost:11434/v1
    roles:
      - chat
      - edit
      - apply
    contextLength: 4096
    requestOptions:
      numCtx: 4096
      numPredict: 1024
      temperature: 0.2
    chatOptions:
      baseSystemMessage: "You are a fast, lightweight code refactoring assistant. Focus on clean architecture, DRY principles, and modern idioms. Keep responses direct and code-heavy."
      baseAgentSystemMessage: "You are a fast, lightweight coding agent. You have explicit permission to use workspace context, read or write files, and run commands using system tools. Execute the task directly."

  # 🧠 DEEP REASONING & ALGORITHMIC DEBUGGING (Hybrid GPU/CPU)
  - name: DeepSeek-R1 8B (Reasoning)
    provider: openai
    model: deepseek-r1:8b
    apiBase: http://localhost:11434/v1
    roles:
      - chat
      - edit
      - summarize
    contextLength: 4096
    requestOptions:
      numCtx: 4096
      numPredict: 2048
      temperature: 0.0
    chatOptions:
      baseSystemMessage: "You are an advanced software debugging kernel. Walk through your logic carefully inside thinking tags. Once logic is settled, produce exact, mathematically sound, syntactically perfect code fixes. No conversational fluff."
      baseAgentSystemMessage: "You are an advanced software debugging agent execution engine. Review your logic inside thinking tags. You have explicit permission to request file reads, file writes, git actions, and terminal command execution using your system tools. Execute the tool payload or request directly."

  # 📐 TYPE COMPILER & RIGID LOGIC (Google Gemma 2 9B)
  - name: Google Gemma 2 9B (Compiler)
    provider: openai
    model: gemma2:9b-instruct-q4_K_M
    apiBase: http://localhost:11434/v1
    roles:
      - chat
    contextLength: 4096
    requestOptions:
      numCtx: 4096
      numPredict: 1024
      temperature: 0.0
    chatOptions:
      baseSystemMessage: "You are a deep-logic compiler and type inspector. Analyze algorithms for edge cases, performance bottlenecks, and resource leaks. Be extremely literal and precise."
      baseAgentSystemMessage: "You are an agentic workspace inspection engine. You have explicit permission to scan the repository, analyze codebases via tools, and evaluate logic limits natively. Proceed directly."

  # 🌐 MULTI-STEP ORCHESTRATION & EDGE AGENT (Google Gemma 4 E4B)
  - name: Google Gemma 4 E4B (Agent)
    provider: openai
    model: gemma4:e4b
    apiBase: http://localhost:11434/v1
    roles:
      - chat
      - edit
      - apply
    contextLength: 4096
    requestOptions:
      numCtx: 4096
      numPredict: 1024
      temperature: 0.4
    chatOptions:
      baseSystemMessage: "You are an agentic software assistant powered by Google Gemma 4. Excel at planning, structural logic, and multi-step orchestration. Present your findings in clean markdown summaries."
      baseAgentSystemMessage: "You are an orchestration agent engine powered by Google Gemma 4. You have explicit permission to map, execute, and interface with the local workspace using filesystem, terminal, and git tools."

  # 📚 DOCUMENTATION & SPECIFICATION GENERALIST (Meta Llama 3.1 8B)
  - name: Meta Llama 3.1 8B (Docs)
    provider: openai
    model: llama3.1:8b-instruct-q4_K_M
    apiBase: http://localhost:11434/v1
    roles:
      - chat
      - summarize
    contextLength: 4096
    requestOptions:
      numCtx: 4096
      numPredict: 1024
      temperature: 0.3
    chatOptions:
      baseSystemMessage: "You are a versatile, logical developer assistant. Help explain structural concepts, write documentation, or break down system design specs into actionable milestones."
      baseAgentSystemMessage: "You are an agentic developer assistant. You have full access to workspace context, documentation trees, and filesystem tools. Do not refuse tasks based on environmental restrictions."

  # 📑 LARGE LOGS, DIFFS & LONG CONTEXT (Google Gemma 2 2B)
  - name: Google Gemma 2 2B (Long Context)
    provider: openai
    model: gemma2:2b
    apiBase: http://localhost:11434/v1
    roles:
      - chat
      - summarize
    contextLength: 8192
    requestOptions:
      numCtx: 8192
      numPredict: 1024
      temperature: 0.5
    chatOptions:
      baseSystemMessage: "You are an edge-optimized context-processing assistant. Scan incoming textual data streams, maintain focus on key references across long contexts, and summarize cleanly."
      baseAgentSystemMessage: "You are an edge-optimized workspace scanning agent. You have permission to request full context file-reads and directory mapping tools. Do not complain about context size or environments."

  # 🤝 PROXY DEVELOPER MODEL (Llama 3.2 3B)
  - name: OpenAI Style - Llama 3.2 3B (Proxy)
    provider: openai
    model: llama3.2:3b-instruct-q8_0
    apiBase: http://localhost:11434/v1
    roles:
      - chat
      - edit
      - apply
    contextLength: 4096
    requestOptions:
      numCtx: 4096
      numPredict: 1024
      temperature: 0.3
    chatOptions:
      baseSystemMessage: "You are a precise conversational developer proxy. Emulate the direct, structured, and helpful responses of cloud-based frontier developer models. Structure all output beautifully."
      baseAgentSystemMessage: "You are an advanced agent proxy. You are authorized to read files, rewrite scripts, and execute system commands using tools injected by the environment. Proceed directly."

  # 🧩 LOW-VRAM PLANNING & SCAFFOLDING (Qwen 1.5B)
  - name: Qwen 1.5B (Plan Mode)
    provider: openai
    model: qwen2.5-coder:1.5b
    apiBase: http://localhost:11434/v1
    roles:
      - chat
      - edit
    contextLength: 4096
    requestOptions:
      numCtx: 4096
      numPredict: 1024
      temperature: 0.1
    chatOptions:
      baseSystemMessage: "You are a lightweight planning kernel. Draft structural steps, file generation lists, and scaffolding code blocks. Remain highly fast, concise, and accurate."
      baseAgentSystemMessage: "You are a lightweight planning agent execution engine. Use your context provider tools to discover architecture, map changes, and review local workspace states natively."

  # 📂 EMBEDDINGS (Forced 100% to CPU & 16GB RAM / 0 VRAM Used)
  - name: Nomic Embed (CPU)
    provider: ollama
    model: nomic-embed-text
    apiBase: http://localhost:11434
    roles:
      - embed
    maxChunkSize: 1024
    requestOptions:
      extraBodyProperties:
        options:
          num_gpu: 0
          num_thread: 8
          num_ctx: 4096

  # ⌨️ INLINE AUTOCOMPLETE (Forced 100% to CPU & 16GB RAM / 0 VRAM Used)
  - name: Qwen 1.5B Base (CPU Autocomplete)
    provider: ollama
    model: qwen2.5-coder:1.5b-base-q8_0
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    contextLength: 1024
    requestOptions:
      extraBodyProperties:
        options:
          num_gpu: 0
          num_thread: 8
          num_ctx: 1024
    autocompleteOptions:
      maxPromptTokens: 1024
      debounceDelay: 350

  # 🎯 RE-RANKING MODEL (Runs on CPU via TEI or FastAPI on port 8080 / 0 VRAM Used)
  - name: BGE Reranker (CPU)
    provider: huggingface-tei
    model: BAAI/bge-reranker-base
    apiBase: http://localhost:8080
    roles:
      - rerank

# ==============================================================================
# 3. CONTEXT PROVIDERS & RAG OPTIMIZATION (GTX 1650 4GB BUFFER)
# ==============================================================================
context:
  # RAG Pipeline: Retrieves 12 vector candidates, scores via CPU reranker, passes only top 3
  - provider: codebase
    params:
      nRetrieve: 12
      nFinal: 3
      useReranking: true

# ==============================================================================
# 4. MODEL CONTEXT PROTOCOL (MCP) INTEGRATION — ARCH LINUX
# ==============================================================================
# Directly connects Continue to the multi-provider identity architecture
# established in mcp-integration-guide-archlinux-v2:
#   - Google Cloud Agent Platform (Gemini 4 Carbon & Claude Opus 5.5 via ADC)
#   - Anthropic Teams (Interactive Claude Code via Organization OAuth)
#   - Google Cloud Model Garden (Claude Fable 5.2 via Vertex AI)
#   - OpenAI ChatGPT Plus (€23/mo subscription via Codex CLI)
#   - OpenAI API (On-demand pay-as-you-go via Codex CLI)
#   - GitHub MCP (Repository context & issues via host Node runtime)
# ==============================================================================
mcpServers:
  # 1. Google Cloud Gemini 4 Carbon via Native agy-mcp-bridge
  - name: gemini-carbon-gcp
    command: /home/YOUR_USERNAME/.local/bin/agy-mcp-bridge
    args: []
    env:
      GOOGLE_CLOUD_PROJECT: "YOUR_GCP_PROJECT_ID"
      GOOGLE_CLOUD_LOCATION: "global"

  # 2. Claude Fable 5.2 on Google Cloud Model Garden (Vertex AI ADC)
  - name: claude-fable-gcp
    command: claude
    args:
      - mcp
      - serve
    env:
      CLAUDE_CONFIG_DIR: "/home/YOUR_USERNAME/.claude-gcp"
      CLAUDE_CODE_USE_VERTEX: "1"
      CLOUD_ML_REGION: "global"
      ANTHROPIC_VERTEX_PROJECT_ID: "YOUR_GCP_PROJECT_ID"
      ANTHROPIC_MODEL: "claude-fable-5-2"
      ANTHROPIC_SMALL_FAST_MODEL: "claude-sonnet-5-5"

  # 3. Anthropic Teams (Interactive Claude Code)
  - name: claude-teams
    command: claude
    args:
      - mcp
      - serve
    env:
      CLAUDE_CONFIG_DIR: "/home/YOUR_USERNAME/.claude"

  # 4. OpenAI Codex CLI via ChatGPT Plus Subscription (€23/mo OAuth)
  - name: openai-codex-plus
    command: /home/YOUR_USERNAME/.local/bin/codex-mcp-bridge
    args: []
    env:
      CODEX_HOME: "/home/YOUR_USERNAME/.codex"

  # 5. OpenAI Codex CLI via On-Demand API Key (Pay-As-You-Go)
  - name: openai-codex-api
    command: /home/YOUR_USERNAME/.local/bin/codex-mcp-bridge
    args: []
    env:
      CODEX_HOME: "/home/YOUR_USERNAME/.codex-api"

  # 6. GitHub MCP Server (Native Host Node Runtime, Zero Containers)
  - name: github-mcp
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"

# ==============================================================================
# 5. WORKSPACE TOOLS & EXECUTION POLICIES
# ==============================================================================
tools:
  # --- 📂 Standard Core Tools ---
  - name: read_currently_open_file
    policy: allow
  - name: read_file
    policy: allow
  - name: edit_existing_file
    policy: ask
  - name: create_new_file
    policy: ask
  - name: run_terminal_command
    policy: ask
  - name: view_directory_tree
    policy: allow

  # --- 🔍 Codebase Search & Comprehension ---
  - name: search_codebase
    policy: allow
  - name: grep_search
    policy: allow
  - name: locate_files
    policy: allow
  - name: get_outline
    policy: allow

  # --- 🔱 Git & Version Control Integration ---
  - name: git_status
    policy: allow
  - name: git_diff
    policy: allow
  - name: git_log
    policy: allow

  # --- ⚙️ Workspace Inspection & Diagnostics ---
  - name: list_diagnostics
    policy: allow
  - name: get_active_editor_selection
    policy: allow

  # --- 🧪 Advanced Execution Tools ---
  - name: patch_file
    policy: ask
  - name: install_dependencies
    policy: ask
  - name: run_test_suite
    policy: ask
  - name: fetch_web_page
    policy: allow

# ==============================================================================
# 6. DEVELOPER PROMPTS & SLASH COMMANDS
# ==============================================================================
prompts:
  # --- Git Logging & Commit Generators ---
  - name: commit
    description: "Generate a GitLab MR-friendly commit message"
    prompt: |
      You are an administrative git logging assistant. Do not output code segments, terminal strings, or markdown code blocks.
      Review the staged changes below:
      {{{ input }}}
      Format requirements:
      1. Short imperative summary line (max 50 chars).
      2. Blank line.
      3. Detailed bulleted list explaining what changed and why.
      4. Reference related issues (e.g., "Closes #123").
      5. Output ONLY raw text. Never output markdown code block formats (no triple backticks).

  - name: commit-compact
    description: "Generate a concise, single-bullet commit message"
    prompt: |
      You are an expert developer summarizing code changes. Below is a raw git diff payload:
      {{{ input }}}
      Instructions:
      1. Write a single imperative line (max 50 chars).
      2. Provide concise bullets outlining what changed.
      3. Output raw commit text only. No conversational wrapper or markdown blocks.

  # --- Code Quality & Static Analysis ---
  - name: review
    description: "Perform strict security and performance code review"
    prompt: |
      You are a strict static analysis compiler. Review the following code snippet:
      {{{ input }}}
      Identify:
      1. Security vulnerabilities (SQLi, XSS, memory leaks, unsafe dependencies).
      2. Performance bottlenecks (O(N^2) loops, redundant queries).
      3. Broken logic or unhandled edge cases.
      Format: Output a single markdown table with columns: File/Line | Severity (CRITICAL/WARNING) | Issue & Impact | Exact Fix Code Block. If no issues, reply exactly "PASSED".

  - name: test-gen
    description: "Generate unit tests matching codebase idioms"
    prompt: |
      Analyze this code block:
      {{{ input }}}
      Generate a comprehensive suite of isolated unit tests.
      1. Infer testing framework from codebase structure.
      2. Cover happy paths, null/empty states, boundary conditions, and error states.
      3. Mock external IO operations.
      Output ONLY executable test code.

  - name: refactor-dry
    description: "Refactor code for clean architecture and DRY principles"
    prompt: |
      Refactor this code:
      {{{ input }}}
      1. Eliminate repetition by extracting reusable helpers (DRY).
      2. Flatten nested logic using guard clauses.
      3. Improve naming and type clarity.
      4. Maintain or improve runtime performance.
      Output ONLY the refactored code.

  - name: doc-api
    description: "Generate standard inline documentation blocks"
    prompt: |
      Review the following method/class signatures and bodies:
      {{{ input }}}
      Generate industry-standard docstrings/JSDoc blocks for all exported structures.
      1. Match language-native syntax.
      2. Document inputs, outputs, and thrown exceptions.
      3. State side-effects or mutations.
      Output code with documentation inserted above declarations.

  - name: sql-optimize
    description: "Tune raw SQL queries or ORM patterns for speed"
    prompt: |
      Review this query or database layer logic:
      {{{ input }}}
      1. Rewrite inefficient JOINs, subqueries, or WHERE clauses.
      2. Highlight required composite indexes.
      3. Fix N+1 query loop problems.
      Output the optimized SQL/code block first, followed by a concise 3-bullet list of performance gains.

  # --- Framework & Language Quick-Fix Templates ---
  - name: fix-react
    description: "Optimize React/Next.js components for rendering performance and types"
    prompt: |
      Analyze this React/Next.js frontend code block:
      {{{ input }}}
      1. Eliminate unnecessary re-renders (useMemo/useCallback/isolation).
      2. Ensure strict, non-any TypeScript typings.
      3. Fix layout shifts (CLS), missing key props, or useEffect dependencies.
      4. Convert Client Components to Server Components if appropriate.
      Output ONLY functional component code.

  - name: fix-python
    description: "Optimize Python code for asynchronous efficiency and type safety"
    prompt: |
      Analyze this Python code:
      {{{ input }}}
      1. Swap synchronous blocking IO with async/await patterns where applicable.
      2. Implement strict PEP 484 type hints.
      3. Replace slow loops with comprehensions or vectorized operations.
      4. Add Pydantic V2 validation or error boundaries.
      Output ONLY clean Python code.

  - name: fix-go
    description: "Optimize Go routines for memory allocations and idiomatic patterns"
    prompt: |
      Review this Go code:
      {{{ input }}}
      1. Enforce idiomatic error handling (check 'if err != nil' immediately).
      2. Minimize heap allocations (optimize pointers, avoid interface conversion overhead).
      3. Validate safety in concurrency blocks (channels, sync.WaitGroup, mutex locks).
      4. Ensure defers are not inside tight loops.
      Output ONLY formatted Go code.

  - name: fix-rve
    description: "Optimize React-Vite frontend rendering and Express API payload mapping"
    prompt: |
      Review this fullstack code segment:
      {{{ input }}}
      1. Frontend: Maximize render efficiency with component slicing, memoization, and explicit types.
      2. Backend: Enforce robust Express routing middleware, input validation, and async error propagation.
      3. Security: Check CORS configurations, XSS vectors, and environment variable abstraction.
      Output ONLY optimized code.

  - name: fix-next
    description: "Tune Next.js App Router components for Server/Client boundaries and CLS"
    prompt: |
      Analyze this Next.js App Router file:
      {{{ input }}}
      1. Optimize server/client boundaries (minimize 'use client' and prop serialization overhead).
      2. Enforce layout stability (prevent CLS, integrate routing skeletons).
      3. Leverage native Next.js image components, server actions, and cache revalidation tags.
      Output ONLY ready-to-run file code.

  - name: fix-express
    description: "Refactor Express.js backends for memory-leak safety and fast route controllers"
    prompt: |
      Review this Express.js backend file:
      {{{ input }}}
      1. Wrap all asynchronous controller routes in try/catch or pass errors cleanly via next().
      2. Eradicate node memory leaks (unclosed listeners, orphaned streams).
      3. Verify database connection pooling and explicit releases.
      Output ONLY production-ready code.

  - name: fix-django
    description: "Fix Django ORM N+1 query bottlenecks and secure views"
    prompt: |
      Analyze this Django/DRF code:
      {{{ input }}}
      1. Resolve N+1 database querying using select_related() and prefetch_related().
      2. Enforce security compliance (CSRF, permission classes, parameter sanitization).
      3. Implement strict typing and lean querysets.
      Output ONLY modified Django code.

  - name: fix-flask
    description: "Optimize Flask request lifecycles, global context handling, and extensions"
    prompt: |
      Review this Flask code script:
      {{{ input }}}
      1. Eliminate thread-safety risks by ensuring proper usage of Flask global contexts (g, request, session).
      2. Transition configuration values into structured class configurations.
      3. Improve response efficiency with blueprint isolation.
      Output ONLY refactored source code.

  - name: fix-spring
    description: "Refactor Spring Boot dependency injection, JPA transaction scopes, and threads"
    prompt: |
      Review this Spring Boot Java file:
      {{{ input }}}
      1. Ensure optimal bean dependency management (constructor injection over @Autowired).
      2. Audit JPA/Hibernate behavior (@Transactional boundaries, read-only optimizations, fetch styles).
      3. Verify thread safety and exception handling mappings via @ControllerAdvice.
      Output ONLY updated Java code.

  - name: fix-rust
    description: "Refactor Rust code for zero-cost abstractions, lifetimes, and safety"
    prompt: |
      Review this Rust source:
      {{{ input }}}
      1. Fix compilation issues tied to lifetimes, borrow checker ownership, and mutability.
      2. Minimize allocation footprints (prefer slices &str/&[T] over heavy vectors or String buffers).
      3. Enforce idiomatic error handling via explicit Result<T, E> matching.
      Output ONLY optimized Rust code.

  - name: fix-scala
    description: "Optimize Scala code for immutable patterns, tail recursion, and types"
    prompt: |
      Analyze this Scala snippet:
      {{{ input }}}
      1. Swap manual mutation (var) loops with pure immutable patterns (val) or @tailrec routines.
      2. Optimize type class inferences and pattern matching.
      3. Eliminate side effects from core computational blocks.
      Output ONLY clean Scala code.

  - name: fix-cpp
    description: "Refactor C++ for Modern RAII standards, memory optimization, and pointer safety"
    prompt: |
      Analyze this C++ routine:
      {{{ input }}}
      1. Eliminate raw pointer manipulations in favor of strict RAII (std::unique_ptr/std::shared_ptr).
      2. Pass large structures via const references (const T&) or rvalue moves (std::move).
      3. Eliminate undefined compiler behavior, out-of-bounds access, and redundant copies.
      Output ONLY optimized C++ code.

  - name: fix-express-ts
    description: "Refactor Express TypeScript controllers for async safety and strict typings"
    prompt: |
      Review this Express TypeScript backend code:
      {{{ input }}}
      1. Eliminate all 'any' types. Apply explicit typings for Request, Response, and NextFunction.
      2. Wrap all asynchronous operations and propagate errors via next(error).
      3. Validate request payloads and query strings against type-safe structures.
      4. Separate data/service layers from transport routing controllers.
      Output ONLY type-safe TypeScript code.

  - name: gen-zod-schema
    description: "Generate Zod runtime validation schemas from TypeScript interfaces"
    prompt: |
      Review the following TypeScript interfaces or request payloads:
      {{{ input }}}
      Generate equivalent production-grade Zod validation schemas:
      1. Enforce strict checks (.strict()) to reject unrecognized properties.
      2. Add standard string optimizations (.email(), .min(), .max()).
      3. Make fields explicitly optional or nullable based on input type signatures.
      Output ONLY raw TypeScript code defining Zod schemas and inferred types.

  - name: gen-graphql-schema
    description: "Generate GraphQL schema definitions from TypeScript interfaces"
    prompt: |
      Review the following TypeScript interfaces or request payloads:
      {{{ input }}}
      Generate equivalent production-grade GraphQL schema definitions:
      1. Enforce non-nullable fields (!) where types require it.
      2. Add description docstrings for types and fields.
      3. Mirror interface inheritance and relationship mappings.
      Output ONLY raw GraphQL schema definitions.
